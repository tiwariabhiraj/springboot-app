name: Spring Boot Build and Deploy

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Spring Boot Application
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Application
        run: |
          chmod +x mvnw
          ./mvnw clean package

      - name: Verify JAR
        run: |
          ls -lh target/
          test -f target/my-app.jar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::022499040191:role/GitHubActionsSpringBootRole
          aws-region: ap-south-1

      - name: Test AWS connection
        run: |
          aws sts get-caller-identity

      - name: Upload JAR to S3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Uploading JAR to S3..."

          aws s3 cp target/my-app.jar \
            s3://${{ vars.S3_BUCKET }}/my-app.jar \
            --no-progress

          echo "JAR uploaded successfully to S3"

      - name: Deploy application to EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Starting deployment to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Spring Boot application" \
            --parameters '{
              "commands": [
                "set -e",
                "echo \"===== CREATING APPLICATION DIRECTORY =====\"",
                "mkdir -p /opt/my-app",
                "echo \"===== DOWNLOADING JAR FROM S3 =====\"",
                "aws s3 cp s3://${{ vars.S3_BUCKET }}/my-app.jar /opt/my-app/my-app.jar --no-progress",
                "echo \"JAR downloaded successfully\"",
                "ls -lh /opt/my-app/my-app.jar",
                "chown ec2-user:ec2-user /opt/my-app/my-app.jar",
                "echo \"===== STOPPING EXISTING APPLICATION =====\"",
                "if [ -f /opt/my-app/app.pid ]; then kill $(cat /opt/my-app/app.pid) || true; rm -f /opt/my-app/app.pid; fi",
                "sleep 3",
                "echo \"===== STARTING SPRING BOOT APPLICATION =====\"",
                "nohup java -jar /opt/my-app/my-app.jar > /opt/my-app/app.log 2>&1 & echo $! > /opt/my-app/app.pid",
                "echo \"Application PID: $(cat /opt/my-app/app.pid)\"",
                "echo \"===== WAITING FOR APPLICATION STARTUP =====\"",
                "sleep 15",
                "PID=$(cat /opt/my-app/app.pid)",
                "echo \"===== CHECKING APPLICATION PROCESS =====\"",
                "if kill -0 $PID 2>/dev/null; then echo \"Application is running with PID $PID\"; else echo \"Application failed to start\"; cat /opt/my-app/app.log; exit 1; fi",
                "echo \"===== CHECKING PORT 9001 =====\"",
                "if ss -lnt | grep -q ':9001'; then echo \"Application is listening on port 9001\"; else echo \"Port 9001 is not listening\"; cat /opt/my-app/app.log; exit 1; fi",
                "echo \"===== APPLICATION LOG =====\"",
                "tail -50 /opt/my-app/app.log",
                "echo \"===== DEPLOYMENT COMPLETE =====\""
              ]
            }' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "======================================"
              echo "Deployment successful!"
              echo "======================================"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" \
                --output text

              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo "======================================"
              echo "Deployment failed!"
              echo "======================================"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ vars.EC2_INSTANCE_ID }}"

              exit 1
            fi

            sleep 5
          done

          echo "Deployment timed out"
          exit 1