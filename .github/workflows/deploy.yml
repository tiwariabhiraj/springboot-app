name: Spring Boot Build and Deploy

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Spring Boot Application
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Application
        run: |
          chmod +x mvnw
          ./mvnw clean package

      - name: Verify JAR
        run: |
          ls -lh target/
          test -f target/my-app.jar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::022499040191:role/GitHubActionsSpringBootRole
          aws-region: ap-south-1

      - name: Test AWS connection
        run: |
          aws sts get-caller-identity

      - name: Upload JAR to S3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws s3 cp target/my-app.jar \
            s3://${{ vars.S3_BUCKET }}/my-app.jar

          echo "JAR uploaded successfully to S3"

      - name: Deploy application to EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Starting deployment to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Spring Boot application" \
            --parameters '{
              "commands": [
                "set -e",
                "echo \"Creating application directory\"",
                "mkdir -p /opt/my-app",
                "echo \"Downloading JAR from S3\"",
                "aws s3 cp s3://${{ vars.S3_BUCKET }}/my-app.jar /opt/my-app/my-app.jar",
                "chown ec2-user:ec2-user /opt/my-app/my-app.jar",
                "echo \"Stopping existing Spring Boot application\"",
                "pkill -f \"java -jar /opt/my-app/my-app.jar\" || true",
                "sleep 3",
                "echo \"Starting Spring Boot application\"",
                "nohup java -jar /opt/my-app/my-app.jar > /opt/my-app/app.log 2>&1 &",
                "sleep 10",
                "echo \"Checking application process\"",
                "pgrep -f \"java -jar /opt/my-app/my-app.jar\"",
                "echo \"Application deployment completed successfully\""
              ]
            }' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "======================================"
              echo "Deployment successful!"
              echo "======================================"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" \
                --output text

              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo "======================================"
              echo "Deployment failed!"
              echo "======================================"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ vars.EC2_INSTANCE_ID }}"

              exit 1
            fi

            sleep 5
          done

          echo "Deployment timed out"
          exit 1